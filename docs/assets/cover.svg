<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PyBOM. Your BOM. A clearer plan.</title>
  <desc id="description">Local material planning for Windows. A simple diagram connects BOM, inventory and demand to a plan.</desc>
  <rect width="1200" height="630" fill="#f4f6fa"/>
  <g transform="translate(64 60)" fill="#2754d7">
    <path d="M9 8h11v24H9M20 20h11" fill="none" stroke="#2754d7" stroke-width="2.5"/>
    <rect x="3" y="3" width="10" height="10" rx="2"/>
    <rect x="3" y="27" width="10" height="10" rx="2"/>
    <rect x="27" y="15" width="10" height="10" rx="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="116" y="91" fill="#12213a" font-size="30" font-weight="700">PyBOM</text>
    <text x="64" y="255" fill="#12213a" font-size="80" font-weight="700" letter-spacing="-3">Your BOM.</text>
    <text x="64" y="348" fill="#12213a" font-size="80" font-weight="700" letter-spacing="-3">A clearer plan.</text>
    <text x="68" y="414" fill="#52627a" font-size="24">Material planning. Cost analysis. Supply visibility.</text>
    <text x="68" y="555" fill="#52627a" font-size="20">Windows x64</text>
    <path d="M222 539v20" stroke="#b5c2d5"/>
    <text x="246" y="555" fill="#52627a" font-size="20">Local workbook processing</text>
    <g transform="translate(820 200)">
      <g fill="#ffffff" stroke="#d9e1ed" stroke-width="1.5">
        <rect width="150" height="60" rx="8"/>
        <rect y="94" width="150" height="60" rx="8"/>
        <rect y="188" width="150" height="60" rx="8"/>
      </g>
      <g fill="#12213a" font-size="21" font-weight="600">
        <text x="24" y="38">BOM</text>
        <text x="24" y="132">Inventory</text>
        <text x="24" y="226">Demand</text>
      </g>
      <path d="M150 30h44v188h-44M194 124h43" fill="none" stroke="#8da3c3" stroke-width="2"/>
      <rect x="237" y="96" width="58" height="58" rx="10" fill="#2754d7"/>
      <path d="m251 124 10 10 20-22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="245" y="187" fill="#2754d7" font-size="20" font-weight="700">Plan</text>
    </g>
  </g>
</svg>
